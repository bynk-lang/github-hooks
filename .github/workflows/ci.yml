name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both jobs use the Bynk release in BYNK_VERSION. The org canary
# (bynk-canary.yml) runs the same checks against each new Bynk release, and
# proposes moving BYNK_VERSION once one passes.

jobs:
  test:
    name: check, format and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
      # The pinned tsc (package.json) for `bynk check --emit` below.
      - run: npm ci --no-audit --no-fund
      - uses: bynk-lang/bynk-ci@16971dbe8db701e2cd3905f68f9e2f50e84ab366 # v1.2.1
        with:
          version-file: BYNK_VERSION   # the canary proposes moving it
          source: .
      # Type-checks the generated Worker with tsc, so a codegen bug is caught
      # here, at the Bynk source it came from (bynk.codegen.tsc_failed), not
      # first in the smoke run or a deploy.
      - name: Type-check the generated Worker
        run: PATH="$PWD/node_modules/.bin:$PATH" bynk check --emit --format short .

  # No `name:` here, so the check reports as
  # "smoke / signed deliveries against the local Worker", whichever workflow
  # calls it: a stable name for a required check.
  smoke:
    uses: ./.github/workflows/smoke.yml
