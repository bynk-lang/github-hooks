name: Set up Bynk
description: >
  Install Node and the pinned Bynk release, verifying the release archive
  against a SHA-256 pinned here rather than one fetched from the release.

inputs:
  version:
    description: The Bynk release tag to install.
    default: v0.492.1
  sha256:
    description: SHA-256 of bynk-<version>-x86_64-unknown-linux-gnu.tar.gz. Change it with the version.
    default: aec1b4515f6a7e95169e0c1cb3b79f665ccb0f34de31b4642ffe6403ad9e4266

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version: 22
    - name: Install Bynk ${{ inputs.version }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        stage="bynk-${VERSION}-x86_64-unknown-linux-gnu"
        tmp="$(mktemp -d)"
        curl -fsSL -o "$tmp/$stage.tar.gz" \
          "https://github.com/bynk-lang/bynk/releases/download/${VERSION}/${stage}.tar.gz"
        echo "${SHA256}  $tmp/$stage.tar.gz" | sha256sum --check --strict
        tar -xzf "$tmp/$stage.tar.gz" -C "$tmp"
        mkdir -p "$HOME/.local/bin"
        install -m 755 "$tmp/$stage/bynk" "$tmp/$stage/bynkc" "$HOME/.local/bin/"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Check the toolchain
      shell: bash
      run: bynk doctor
