# Keeps the workflows' actions current. Every action is pinned by commit SHA
# (with its tag in a comment), including the org's own (bynk-ci, setup-bynk and
# the canary's reusable workflow), so updates arrive as pull requests rather
# than moving under a tag. The Bynk version itself is BYNK_VERSION, which the
# org canary moves.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The pinned tools (package.json): wrangler, which `bynk dev` serves with,
  # and tsc, for `bynk check --emit`. A new wrangler brings a new local
  # runtime (#84), so it arrives as a pull request whose smoke run tests it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates together; a major (TypeScript 7, a wrangler 5)
    # comes in its own pull request, so one that fails `--emit` or the smoke
    # run doesn't hold back the others.
    groups:
      tools:
        patterns: ["*"]
        update-types: ["minor", "patch"]
