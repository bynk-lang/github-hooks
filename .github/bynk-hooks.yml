# This repository's settings for its own GitHub App (docs/settings.md).
# Every feature is off unless it's turned on here.

# Issue triage (#95, docs/proposals.md#issue-triage): Claude Haiku 5.5 suggests
# labels for each new issue, and a maintainer approves or declines them in
# Mine. Only the labels that say what an issue is about are offered: the ones
# for pull requests (dependencies, github_actions, javascript), the canary's
# own, and the maintainers' decisions (duplicate, invalid, wontfix, good first
# issue, help wanted) are left to people.
triage:
  enabled: true
  labels: [bug, enhancement, documentation, question]

# Stale pull request nudges (#103, docs/proposals.md#stale-pull-request-nudges):
# each weekday at 07:43 UTC, a ready pull request that has waited on its
# requested reviewers for 3 whole days or more gets a proposed comment to
# them, which a maintainer approves or declines in Mine.
nudges:
  enabled: true
  after_days: 3
