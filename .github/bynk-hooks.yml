# This repository's settings for its own GitHub App (docs/settings.md).
# Every feature is off unless it's turned on here.

# Issue triage (#95, docs/proposals.md#issue-triage): Claude Haiku 5.5 suggests
# labels for each new issue, and a maintainer approves or declines them in
# Mine. Only the labels that say what an issue is about are offered: the ones
# for pull requests (dependencies, github_actions, javascript), the canary's
# own, and the maintainers' decisions (duplicate, invalid, wontfix, good first
# issue, help wanted) are left to people.
triage:
  enabled: true
  labels: [bug, enhancement, documentation, question]

# Stale pull request nudges (#103, docs/proposals.md#stale-pull-request-nudges):
# each weekday at 07:43 UTC, a ready pull request that has waited on its
# requested reviewers for 3 whole days or more gets a proposed comment to
# them, which a maintainer approves or declines in Mine.
nudges:
  enabled: true
  after_days: 3

# Release notes drafts (#110, docs/proposals.md#release-notes-drafts): when a
# final release is published with an empty description, or only GitHub's
# generated list, Claude Opus 5.5 sorts the pull requests it shipped and
# writes a summary, and a maintainer approves or declines the notes in Mine.
release_notes:
  enabled: true

# The weekly summary (#119, docs/proposals.md#the-weekly-summary): each
# weekday at 07:43 UTC, for the week before the latest Monday, Claude Opus 5.5
# writes a few paragraphs on bynk-lang's public week, and the App proposes the
# post, with a table of figures and the releases, for a maintainer to approve
# in Mine. It's the organisation's summary, so only this repository turns it
# on. Approving posts it to this repository's Discussions, in Announcements;
# if GitHub refuses the App there, this becomes General.
weekly_summary:
  enabled: true
  category: Announcements

review:
  enabled: true
  # guidelines: .github/review-guidelines.md   # optional: your own review notes for Claude, read from the default branch, up to 20,000 characters
  authors: members                           # the default; "all" also reviews outside contributors' pull requests
